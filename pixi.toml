[project]
name = "fig"
version = "0.0.1"
description = "Fragrance information grabber and visualizer."
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.11.*"
pip = "*"

[pypi-dependencies]
streamlit = ">=1.38.0"
pandas = ">=2.2.2"
pdfplumber = ">=0.11.10"

[tasks]
start = "streamlit run app.py"